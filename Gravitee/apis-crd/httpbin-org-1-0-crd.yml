    selectors:
    - type: "CONDITION"
      condition: ""
    - type: "HTTP"
      path: "/delete"
      pathOperator: "EQUALS"
      methods:
      - "DELETE"
  - id: "6af4f3fa-4865-4ede-b4f3-fa48650ede31"
    enabled: true
    selectors:
    - type: "CONDITION"
      condition: ""
    - type: "HTTP"
      path: "/xml"
      pathOperator: "EQUALS"
      methods:
      - "GET"
  - id: "ffdfa62f-7dca-46c5-9fa6-2f7dca76c51c"
    enabled: true
    selectors:
    - type: "CONDITION"
      condition: ""
    - type: "HTTP"
      path: "/ip"
      pathOperator: "EQUALS"
