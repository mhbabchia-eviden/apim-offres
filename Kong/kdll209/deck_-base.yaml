services:
- connect_timeout: 60000
  enabled: true
  host: httpbin.docker.local
  name: Httpbin_API_SVC
  path: /
  port: 80
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
